name: GoFile Torrent Tiny11 Debloat

on:
  workflow_dispatch:
    inputs:
        gofile_url:
            description: 'GoFile page URL (https://gofile.io/d/xxx) OR direct download URL (https://store-*.gofile.io/download/web/...) — right-click download button in browser, Copy Link Address'
            required: true
            type: string

jobs:
  process_iso:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Fetching ISO from GoFile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "${{ inputs.gofile_url }}"

          # Check if this is a GoFile page URL or a direct download URL
          if ($url -match 'gofile\.io/d/') {
            # GoFile page URL: fetch page to get cookies, then call API
            $gofileId = ($url -split '/')[-1]
            Write-Output "Resolving GoFile page for content ID: $gofileId"

            # Create session to capture cookies like a browser would
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            try {
              $null = Invoke-WebRequest -Uri $url -WebSession $session `
                -UseBasicParsing -TimeoutSec 30 `
                -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
            } catch {
              Write-Warning "Page fetch failed (non-fatal): $_"
            }

            # Try API with session cookies
            try {
              $apiResponse = Invoke-RestMethod `
                -Uri "https://api.gofile.io/getContent?contentId=$gofileId" `
                -WebSession $session
              if ($apiResponse.status -eq "ok") {
                $files = $apiResponse.data.contents.PSObject.Properties.Value
                if ($files) {
                  $directDownloadUrl = $files[0].link
                  Write-Output "Resolved via API: $($files[0].name)"
                }
              }
            } catch {
              Write-Warning "API resolution failed: $_"
            }

            if (-not $directDownloadUrl) {
              $msg = "GoFile API returned error-notFound. The API now requires account authentication. " +
                     "Open $url in your browser, right-click the download button, " +
                     "select 'Copy Link Address', and re-run with that direct URL. " +
                     "Direct URLs look like: https://store-*.gofile.io/download/web/<id>/<filename.iso>"
              throw $msg
            }
          } else {
            # Direct download URL: use as-is
            $directDownloadUrl = $url
            Write-Output "Using direct download URL"
          }

          Write-Output "Direct URL: $directDownloadUrl"
          Invoke-WebRequest -Uri $directDownloadUrl -OutFile "input.iso"

      - name: Fetching Tiny11 Builder Script
        shell: pwsh
        run: |
           # TARGETS THE EXACT COMPREHENSIVE ZIP MASTER ARCHIVE LINK
           curl.exe -L -o tiny11.zip https://github.com/ntdevlabs/tiny11builder/archive/refs/heads/main.zip
           tar -xf tiny11.zip
           Get-ChildItem -Path "tiny11builder-main\*" | Move-Item -Destination .
           Remove-Item -Path "tiny11builder-main" -Recurse -Force
           Remove-Item -Path "tiny11.zip"

      - name: Executing Tiny11 Debloat Logic
        timeout-minutes: 180
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseIso = Get-ChildItem "input.iso" | Select-Object -First 1
          if (-not $baseIso) { throw "Target image file resolution failed." }

          # 1. Mount the original UUP ISO
          Write-Output "Mounting your baseline ISO: $($baseIso.Name)"
          $mountDrive = (Mount-DiskImage -ImagePath $baseIso.FullName -PassThru | Get-Volume).DriveLetter

          # 2. Prepare isolated scratch directory
          $scratchDir = Join-Path $env:RUNNER_TEMP scratch_dir
          New-Item -ItemType Directory -Path $scratchDir -Force | Out-Null
          Write-Output "Scratch directory: $scratchDir"

          # 3. Loosen execution constraints to let PowerShell run tiny11maker
          Set-ExecutionPolicy Bypass -Scope Process -Force

          # 4. Modify default autounattend answer configuration profile
          # Remove local account bypass rules so Microsoft Account registration stays intact
          if (Test-Path .\autounattend.xml) {
             $xml = (Get-Content .\autounattend.xml) |
                    Where-Object { $_ -notmatch 'OOBE\\BypassNRO' }
             $xml | Set-Content .\autounattend.xml
          }

          # 5. Run tiny11maker with official parameter flags
          Write-Output "Executing tiny11maker.ps1 using Mount Drive $mountDrive"
          .\tiny11maker.ps1 -ISO $mountDrive -SCRATCH $scratchDir

          # 6. Safely unmount volume allocations and clean up
          Dismount-DiskImage -ImagePath $baseIso.FullName
          Remove-Item $baseIso.FullName -Force
          Remove-Item -Recurse -Force $scratchDir

          # 7. Rename output
          if (Test-Path .\tiny11.iso) {
             Rename-Item -Path .\tiny11.iso -NewName "Debloated_Windows11_23H2.iso"
          } else {
             throw "Tiny11 engine failed to output a modified ISO."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create WebSeeded Torrent & Upload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # 1. Install torrent creation tool
          npm install -g create-torrent

          # 2. Locate the final debloated output ISO
          $isoFile = Get-ChildItem "Debloated_Windows11_23H2.iso" | Select-Object -First 1
          if (-not $isoFile) { throw "Final output ISO file target missing." }

          # 3. Upload ISO to GoFile
          Write-Output "Resolving GoFile upload server..."
          $servers = Invoke-RestMethod -Uri "https://api.gofile.io/servers"
          $server = $servers.data.servers[0].name
          if (-not $server) { throw "Failed to resolve GoFile upload server." }

          Write-Output "Uploading $($isoFile.Name) to $server.gofile.io..."
          $uploadResult = Invoke-RestMethod -Uri "https://${server}.gofile.io/uploadFile" `
            -Method Post -Form @{ file = Get-Item $isoFile.Name }
          if ($uploadResult.status -ne "ok") {
            throw "GoFile upload failed. Status: $($uploadResult.status)"
          }

          # uploadResult.data.downloadPage = https://gofile.io/d/xxxxx
          $downloadPage = $uploadResult.data.downloadPage
          Write-Output "GoFile download page: $downloadPage"

          # Save the download page link as fallback artifact
          $downloadPage | Out-File -FilePath gofile_link.txt -Encoding utf8

          # Write to step summary so link is visible in the run log
          "## GoFile Download Link`n$downloadPage" >> $env:GITHUB_STEP_SUMMARY

          # 4. Resolve download page -> direct download URL for webseed
          $contentId = ($downloadPage -split '/')[-1]
          $contentResponse = Invoke-RestMethod -Uri "https://api.gofile.io/getContent?contentId=$contentId"
          if ($contentResponse.status -ne "ok") {
            throw "Failed to resolve direct download URL. Status: $($contentResponse.status)"
          }
          $directUrl = $contentResponse.data.contents.PSObject.Properties.Value[0].link
          Write-Output "Direct webseed URL: $directUrl"

          # 5. Create torrent with GoFile direct link as webseed
          create-torrent $isoFile.Name --urlList $directUrl --output output.torrent

          Write-Output "=========================================================="
          Write-Output "TORRENT METADATA MAP SUCCESSFULLY GENERATED VIA WEBSEED"
          Write-Output "=========================================================="

      - name: Upload Output Torrent Descriptor
        uses: actions/upload-artifact@v4
        with:
          name: windows_debloated_torrent_${{ github.run_id }}
          path: output.torrent

      - name: Upload GoFile Download Link
        uses: actions/upload-artifact@v4
        with:
          name: gofile_download_link_${{ github.run_id }}
          path: gofile_link.txt
